<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Palestra del Cervello Destro</title>
<style>
  :root{ --paper:#EFEAE0; --paper-2:#E6DFCF; --ink:#23262B; --ink-soft:#4A4E55; --indigo:#2D4A6B; --indigo-deep:#1C324B; --vermilion:#C1442E; --gold:#B8935A; --line:rgba(35,38,43,.14); --radius:18px; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:radial-gradient(ellipse at 10% -10%, rgba(45,74,107,.06), transparent 45%), var(--paper); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px;margin:0 auto;padding:24px 18px 80px;}
  .eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--indigo);font-weight:600;}
  h1{font-size:clamp(28px,6vw,40px);color:var(--indigo-deep);margin:4px 0 6px;font-weight:800;}
  .lead{color:var(--ink-soft);margin:0 0 22px;max-width:52ch;}
  .doors{display:grid;gap:14px;}
  .door{display:block;width:100%;text-align:left;border:0;cursor:pointer;color:#fff;border-radius:var(--radius);padding:20px 20px 18px;box-shadow:0 8px 22px rgba(28,50,75,.18);font:inherit;}
  .door h2{margin:0 0 2px;font-size:26px;letter-spacing:.01em;}
  .door .sub{opacity:.88;font-size:14px;margin:0 0 12px;}
  .door .stage{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;}
  .bar{height:7px;background:rgba(255,255,255,.28);border-radius:99px;margin-top:10px;overflow:hidden;}
  .bar i{display:block;height:100%;background:#fff;border-radius:99px;transition:width .4s;}
  .door small{display:block;margin-top:6px;opacity:.85;font-size:13px;}
  .corpo{background:var(--vermilion);} .mente{background:var(--indigo);} .spirito{background:#9A7640;}
  .back{border:0;background:none;color:var(--indigo);font:inherit;font-weight:600;padding:8px 0;cursor:pointer;}
  .head{color:#fff;border-radius:var(--radius);padding:18px 20px;margin-bottom:16px;}
  .head h2{margin:0;font-size:28px;} .head p{margin:4px 0 0;opacity:.9;font-size:14px;}
  .st{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:12px;overflow:hidden;}
  .st > .top{display:flex;align-items:center;gap:10px;padding:14px 16px;}
  .st .em{font-size:24px;} .st .nm{font-weight:700;font-size:17px;flex:1;} .st .tag{font-size:12px;color:var(--ink-soft);}
  .st.locked{background:var(--paper-2);opacity:.78;}
  .st .lockmsg{padding:0 16px 14px;color:var(--ink-soft);font-size:14px;}
  .ex{display:block;padding:12px 16px;border-top:1px solid var(--line);text-decoration:none;color:inherit;}
  .ex b{display:block;font-size:16px;color:var(--indigo-deep);} .ex span{font-size:13.5px;color:var(--ink-soft);} .ex em{font-style:normal;font-size:11.5px;color:var(--ink-soft);opacity:.8;}
  .toast{position:fixed;left:14px;right:14px;bottom:18px;max-width:560px;margin:0 auto;background:var(--indigo-deep);color:#fff;border-radius:14px;padding:14px 16px;box-shadow:0 10px 30px rgba(0,0,0,.3);display:none;}
  .toast button{margin-top:8px;border:0;border-radius:99px;padding:8px 16px;font:inherit;font-weight:600;background:#fff;color:var(--indigo-deep);cursor:pointer;}

  :root{ --idle-glyph: url(seme.png); --c-red:#d12b27; --c-green:#3f9142; --c-yellow:#f2c230; --c-blue:#3571b5; }
  @keyframes seedBreath{ 0%,100%{transform:scale(1); opacity:.92;} 50%{transform:scale(1.045); opacity:1;} }
  @media (prefers-reduced-motion: reduce){ .seedg{animation:none !important;} }
  .seedg{background:var(--idle-glyph) no-repeat center / contain; animation:seedBreath 6s ease-in-out infinite;}
  .strip{height:5px;background:linear-gradient(90deg,var(--c-red) 0 25%,var(--c-green) 25% 50%,var(--c-yellow) 50% 75%,var(--c-blue) 75% 100%);}
  .tag2{font-family:Georgia,"Times New Roman",serif;letter-spacing:.2em;font-size:13px;}
  /* A: banda scura come le altre app */
  .vA .top{background:linear-gradient(160deg,#425a70,#27465a);color:#fff;border-radius:var(--radius);overflow:hidden;margin-bottom:18px;box-shadow:0 8px 22px rgba(28,50,75,.22);}
  .vA .top .in{display:flex;align-items:center;gap:16px;padding:18px 18px 16px;}
  .vA .top .seedg{width:70px;height:106px;flex:0 0 auto;}
  .vA .top h1{color:#fff;margin:2px 0 4px;font-size:28px;line-height:1.1;}
  .vA .top .tag2{color:rgba(255,255,255,.88);}
  .vA .top .eyebrow{color:rgba(255,255,255,.75);}
  /* B: seme grande al centro */
  .vB .top{text-align:center;padding:6px 0 10px;}
  .vB .top .seedg{width:150px;height:200px;margin:0 auto;background-color:#27465a;border-radius:90px 90px 70px 70px;background-origin:content-box;padding:22px;box-shadow:0 12px 30px rgba(28,50,75,.28);}
  .vB .top h1{margin:14px 0 4px;} .vB .top .tag2{color:var(--indigo);} .vB .top .lead{margin:10px auto 0;}
  /* C: seme dentro un anello a tre archi che si riempie con la pratica */
  .vC .top{text-align:center;padding:4px 0 6px;}
  .ring{position:relative;width:190px;height:190px;margin:0 auto;}
  .ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg);}
  .ring .seedg{position:absolute;inset:34px;}
  .ring .core{position:absolute;inset:24px;border-radius:50%;background:linear-gradient(160deg,#425a70,#27465a);}
  .vC .top h1{margin:10px 0 2px;} .vC .top .tag2{color:var(--indigo);}
  .foot{margin-top:28px;font-size:12.5px;color:var(--ink-soft);display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
  .foot a{color:var(--indigo);}
</style>
</head>
<body>
<div class="wrap">
  <div id="view"></div>
  <div class="foot"><span id="ver">Palestra v1</span><a href="../">Vai a Respiro e Presenza</a></div>
</div>
<div class="toast" id="toast"><div id="toastTxt"></div><button id="toastOk" type="button">Continua</button></div>
<script>
(function(){
  var ITEMS = [{"door": "corpo", "stage": 0, "app": "b", "go": "specchio", "t": "Specchio dei sei passi", "sub": "Controlla la postura dai piedi alla testa"}, {"door": "corpo", "stage": 0, "app": "b", "go": "hands", "t": "Ginnastica delle mani", "sub": "Un gesto alla volta, o a due mani"}, {"door": "corpo", "stage": 0, "app": "r", "go": "pranayama:dirgha", "t": "Respiro a tre stadi", "sub": "Pancia, torace, petto"}, {"door": "corpo", "stage": 1, "app": "r", "go": "relax", "t": "Rilassamento", "sub": "Contrai e rilascia"}, {"door": "corpo", "stage": 1, "app": "b", "go": "camminata", "t": "Camminata 3–3", "sub": "Tre passi dentro, tre passi fuori"}, {"door": "corpo", "stage": 1, "app": "b", "go": "trace", "t": "Traccia le forme", "sub": "Motricità fine, con tutte e due le mani"}, {"door": "corpo", "stage": 1, "app": "r", "go": "pranayama:leone", "t": "Respiro del leone", "sub": "Scioglie il viso"}, {"door": "corpo", "stage": 3, "app": "b", "go": "cross", "t": "Movimento incrociato", "sub": "Routine di circa 3 minuti, corpo intero"}, {"door": "corpo", "stage": 3, "app": "r", "go": "ghiaccio", "t": "Sciogliersi come ghiaccio", "sub": "Il corpo si scioglie come ghiaccio al sole"}, {"door": "corpo", "stage": 3, "app": "b", "go": "maniresp", "t": "Mani che salgono e scendono", "sub": "Le mani seguono il respiro"}, {"door": "corpo", "stage": 2, "app": "b", "go": "alberoamico", "t": "L’albero amico", "sub": "All’aperto: radici, tronco, respiro"}, {"door": "corpo", "stage": 2, "app": "r", "go": "autoreg:tensione", "t": "Soglia di Tensione", "sub": "Nota e sciogli la tensione"}, {"door": "corpo", "stage": 2, "app": "r", "go": "pranayama:bhastrika", "t": "Respiro del mantice", "sub": "Energia vivace"}, {"door": "corpo", "stage": 4, "app": "b", "go": "chiusura", "t": "Gesti di chiusura", "sub": "Un piccolo auto-massaggio per chiudere"}, {"door": "corpo", "stage": 4, "app": "b", "go": "laboratorio", "t": "Laboratorio", "sub": "Sperimentiamo insieme, senza garanzie"}, {"door": "mente", "stage": 0, "app": "r", "go": "breath", "t": "Respirazione yogica quadrata", "sub": "Dentro · ferma · fuori · ferma"}, {"door": "mente", "stage": 0, "app": "r", "go": "contemplare", "t": "Contemplare il respiro", "sub": "Osservare il respiro senza cambiarlo"}, {"door": "mente", "stage": 0, "app": "c", "go": "flash", "t": "Flashcard Lampo", "sub": "Immagini veloci: guarda e ricorda l’ordine"}, {"door": "mente", "stage": 0, "app": "r", "go": "kn", "t": "Il vento nel naso", "sub": "Narici alternate in versione gioco (bambini)"}, {"door": "mente", "stage": 1, "app": "c", "go": "memory", "t": "Catena della Memoria", "sub": "Collega le parole con immagini buffe"}, {"door": "mente", "stage": 1, "app": "c", "go": "occhimorbidi", "t": "Occhi morbidi e linea di ancoraggio", "sub": "Sguardo morbido, visione larga"}, {"door": "mente", "stage": 1, "app": "r", "go": "mandala", "t": "Mandala", "sub": "Guarda e visualizza"}, {"door": "mente", "stage": 3, "app": "c", "go": "grid", "t": "Occhio di Kim", "sub": "Guarda la griglia e ritrova le coppie"}, {"door": "mente", "stage": 3, "app": "c", "go": "fixation", "t": "Fissazione e immagine residua", "sub": "Tre esercizi di training visivo"}, {"door": "mente", "stage": 3, "app": "c", "go": "mmemoria", "t": "Mandala-memoria", "sub": "Guarda un mandala, poi ricostruiscilo"}, {"door": "mente", "stage": 3, "app": "c", "go": "paesaggio", "t": "Portarsi dentro il paesaggio", "sub": "Guarda un paesaggio, poi ricrealo nella mente"}, {"door": "mente", "stage": 2, "app": "c", "go": "corsi", "t": "Test di Corsi", "sub": "Ripeti la sequenza di blocchi"}, {"door": "mente", "stage": 2, "app": "c", "go": "pair", "t": "Gioco in coppia", "sub": "Concentrazione condivisa tra due persone"}, {"door": "mente", "stage": 2, "app": "c", "go": "listen", "t": "Ascolto rapido", "sub": "Una voce che accelera, poi qualche domanda"}, {"door": "mente", "stage": 2, "app": "c", "go": "speed", "t": "Lettura veloce", "sub": "Leggi una volta sola, poi la verifica"}, {"door": "mente", "stage": 4, "app": "c", "go": "nback", "t": "N-Back", "sub": "Memoria di lavoro: cosa hai visto N turni fa?"}, {"door": "mente", "stage": 4, "app": "c", "go": "stroop", "t": "Parola e colore", "sub": "Le due mani, i colori e le parole"}, {"door": "mente", "stage": 4, "app": "c", "go": "percorsi", "t": "Percorsi di circa 10 minuti", "sub": "Una sequenza di esercizi, uno dopo l’altro"}, {"door": "mente", "stage": 4, "app": "c", "go": "laboratorio", "t": "Laboratorio", "sub": "Sperimentiamo insieme, senza garanzie"}, {"door": "spirito", "stage": 0, "app": "r", "go": "bambini", "t": "Gioco e calma", "sub": "Per i bambini: onda, vento, seme e animale amico"}, {"door": "spirito", "stage": 0, "app": "r", "go": "pranayama:bhramari", "t": "Respiro dell’ape", "sub": "Un ronzio che calma"}, {"door": "spirito", "stage": 0, "app": "r", "go": "unodieci", "t": "Uno–Dieci", "sub": "Radicarsi: dieci immagini"}, {"door": "spirito", "stage": 0, "app": "r", "go": "pranayama:nadi", "t": "Narici alternate", "sub": "Calma e equilibrio"}, {"door": "spirito", "stage": 1, "app": "r", "go": "arcobaleno", "t": "Respirazione arcobaleno", "sub": "I sette colori entrano nel corpo con il respiro"}, {"door": "spirito", "stage": 1, "app": "r", "go": "montagna", "t": "La montagna", "sub": "Visualizzazione guidata: le stagioni passano"}, {"door": "spirito", "stage": 1, "app": "r", "go": "acqua", "t": "Immergersi nell’acqua di luce", "sub": "Un bagno di acqua piena di luce e colore"}, {"door": "spirito", "stage": 1, "app": "r", "go": "kv", "t": "Fantasia calma", "sub": "Una cosa che agita, resa facile e bella"}, {"door": "spirito", "stage": 3, "app": "r", "go": "soleluna", "t": "Sole e Luna", "sub": "Luce dorata e luce argentata che si incontrano"}, {"door": "spirito", "stage": 3, "app": "r", "go": "giardino", "t": "Giardino dei cinque colori", "sub": "Cinque giardini, cinque colori, cinque emozioni"}, {"door": "spirito", "stage": 3, "app": "r", "go": "autoreg:visualizzazione", "t": "Visualizzazione positiva", "sub": "Prepara una situazione"}, {"door": "spirito", "stage": 2, "app": "r", "go": "tredantian", "t": "Aprire e chiudere i tre Dan Tian", "sub": "In piedi: tre altezze"}, {"door": "spirito", "stage": 2, "app": "r", "go": "seicolori", "t": "Le sei porte dei colori", "sub": "Una nuvola di sei colori"}, {"door": "spirito", "stage": 2, "app": "r", "go": "percorsi", "t": "Percorsi di circa 10 minuti", "sub": "Una sequenza di esercizi, un solo tocco per partire"}, {"door": "spirito", "stage": 4, "app": "r", "go": "laboratorio", "t": "Laboratorio", "sub": "Sperimentiamo insieme, senza garanzie"}];
  var DOORS = {
    corpo:{nome:'Corpo',txt:'Posture, gesti, movimento e rilassamento fisico.'},
    mente:{nome:'Mente',txt:'Attenzione, memoria, immagini e concentrazione.'},
    spirito:{nome:'Spirito',txt:'Luce, immagini interiori, presenza e calma.'}
  };
  var STAGES = [
    {n:'Seme',em:'🌰',soglia:0},{n:'Germoglio',em:'🌱',soglia:5},{n:'Albero',em:'🌳',soglia:15},{n:'Fiore',em:'🌸',soglia:30},{n:'Frutto',em:'🍎',soglia:60}
  ];
  var BASE = {r:'../', c:'../concentrazione-e-memoria/', b:'../corpo-e-movimento/'};
  var APPN = {r:'Respiro e Presenza', c:'Concentrazione e Memoria', b:'Corpo e Movimento'};
  var view = document.getElementById('view');
  function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
  // comandi nascosti per chi prova l'app
  var h = location.hash;
  if(h === '#apri-tutto') ls('pcd_hub_all','1');
  if(h === '#normale') ls('pcd_hub_all',null);
  function all(){ return ls('pcd_hub_all') === '1'; }
  function pratiche(door){ try{ var o = JSON.parse(ls('pcd_prac')||'{}'); return (o[door]||[]).length; }catch(e){ return 0; } }
  function livello(door){ var n = pratiche(door), L = 0; for(var i=0;i<STAGES.length;i++){ if(all() || n >= STAGES[i].soglia) L = i; } return L; }
  function url(it){
    var g = it.go;
    if(g === 'laboratorio') return BASE[it.app] + '#laboratorio';
    return BASE[it.app] + '#vai=' + encodeURIComponent(g);
  }
  function el(t,c,x){ var e = document.createElement(t); if(c) e.className = c; if(x!==undefined) e.textContent = x; return e; }

  function header(){
    var v = (/[?&]v=([ABC])/.exec(location.search)||[])[1] || 'A';
    document.body.className = 'v'+v;
    var top = el('div','top');
    var tag = el('div','tag2','vedere · sentire · essere');
    if(v==='A'){
      var inn = el('div','in'); inn.appendChild(el('div','seedg'));
      var t = el('div'); t.appendChild(el('div','eyebrow','Visione Cosciente'));
      t.appendChild(el('h1',null,'Tre porte,\nun cammino')); t.appendChild(tag); inn.appendChild(t);
      top.appendChild(inn); top.appendChild(el('div','strip'));
    } else if(v==='B'){
      top.appendChild(el('div','seedg')); top.appendChild(el('h1',null,'Tre porte, un cammino')); top.appendChild(tag);
    } else {
      var ring = el('div','ring');
      var NS='http://www.w3.org/2000/svg', svg = document.createElementNS(NS,'svg'); svg.setAttribute('viewBox','0 0 100 100');
      var cols = {corpo:'#C1442E',mente:'#2D4A6B',spirito:'#B8935A'}, R=46, C=2*Math.PI*R, seg=C/3;
      Object.keys(DOORS).forEach(function(d,i){
        var bg = document.createElementNS(NS,'circle'); bg.setAttribute('cx',50); bg.setAttribute('cy',50); bg.setAttribute('r',R);
        bg.setAttribute('fill','none'); bg.setAttribute('stroke',cols[d]); bg.setAttribute('stroke-opacity','.22'); bg.setAttribute('stroke-width',5);
        bg.setAttribute('stroke-dasharray',(seg-3)+' '+(C-seg+3)); bg.setAttribute('stroke-dashoffset',-i*seg); svg.appendChild(bg);
        var f = Math.min(1, pratiche(d)/STAGES[4].soglia), fg = document.createElementNS(NS,'circle');
        fg.setAttribute('cx',50); fg.setAttribute('cy',50); fg.setAttribute('r',R); fg.setAttribute('fill','none'); fg.setAttribute('stroke',cols[d]); fg.setAttribute('stroke-width',5); fg.setAttribute('stroke-linecap','round');
        fg.setAttribute('stroke-dasharray',Math.max(0.01,(seg-3)*f)+' '+C); fg.setAttribute('stroke-dashoffset',-i*seg); svg.appendChild(fg);
      });
      ring.appendChild(svg); ring.appendChild(el('div','core')); ring.appendChild(el('div','seedg'));
      top.appendChild(ring); top.appendChild(el('h1',null,'Tre porte, un cammino')); top.appendChild(tag);
    }
    view.appendChild(top);
  }
  function home(){
    view.innerHTML = '';
    header();
    view.appendChild(el('p','lead','Scegli una porta. Le tappe si aprono man mano che pratichi: ogni giorno in cui ti alleni in una porta conta una pratica.'));
    var box = el('div','doors');
    Object.keys(DOORS).forEach(function(d){
      var L = livello(d), n = pratiche(d), b = el('button','door '+d);
      b.type = 'button';
      b.appendChild(el('h2',null,DOORS[d].nome));
      b.appendChild(el('p','sub',DOORS[d].txt));
      b.appendChild(el('div','stage',STAGES[L].em+' '+STAGES[L].n));
      var next = STAGES[L+1], bar = el('div','bar'), i = el('i');
      var from = STAGES[L].soglia, to = next ? next.soglia : STAGES[L].soglia;
      i.style.width = (next ? Math.min(100, Math.round(100*(n-from)/(to-from))) : 100) + '%';
      bar.appendChild(i); b.appendChild(bar);
      b.appendChild(el('small',null, all() ? 'Tutte le tappe aperte' : (next ? n+' pratiche · prossima tappa ('+next.n+') a '+next.soglia : n+' pratiche · hai raggiunto il Frutto')));
      b.addEventListener('click', function(){ location.hash = d; });
      box.appendChild(b);
    });
    view.appendChild(box);
    checkNew();
  }
  function porta(d){
    view.innerHTML = '';
    var back = el('button','back','← Le tre porte'); back.type = 'button';
    back.addEventListener('click', function(){ location.hash = ''; });
    view.appendChild(back);
    var head = el('div','head '+d); head.appendChild(el('h2',null,DOORS[d].nome)); head.appendChild(el('p',null,DOORS[d].txt));
    view.appendChild(head);
    var L = livello(d), n = pratiche(d);
    STAGES.forEach(function(S,i){
      var open = i <= L, card = el('div','st'+(open?'':' locked'));
      var top = el('div','top'); top.appendChild(el('span','em',S.em)); top.appendChild(el('span','nm',S.n));
      top.appendChild(el('span','tag', open ? (i===L?'Tappa attuale':'Aperta') : 'Chiusa'));
      card.appendChild(top);
      if(open){
        ITEMS.filter(function(x){ return x.door===d && x.stage===i; }).forEach(function(it){
          var a = el('a','ex'); a.href = url(it);
          a.appendChild(el('b',null,it.t)); a.appendChild(el('span',null,it.sub));
          a.appendChild(el('em',null,' · '+APPN[it.app]));
          card.appendChild(a);
        });
      } else {
        card.appendChild(el('div','lockmsg','Si apre dopo '+S.soglia+' pratiche in questa porta (ne hai '+n+').'));
      }
      view.appendChild(card);
    });
  }
  function route(){
    var d = (location.hash||'').replace('#','');
    if(DOORS[d]) porta(d); else home();
    window.scrollTo(0,0);
  }
  // messaggio quando si apre una tappa nuova
  function checkNew(){
    var seen; try{ seen = JSON.parse(ls('pcd_hub_seen')||'{}'); }catch(e){ seen = {}; }
    var msg = null;
    Object.keys(DOORS).forEach(function(d){
      var L = livello(d);
      if(seen[d] === undefined){ seen[d] = L; return; }
      if(L > seen[d] && !msg){ msg = 'Porta '+DOORS[d].nome+': '+STAGES[L-1].n+' → '+STAGES[L].n+'. Si è aperta una nuova tappa.'; }
      seen[d] = L;
    });
    ls('pcd_hub_seen', JSON.stringify(seen));
    if(msg){ var t = document.getElementById('toast'); document.getElementById('toastTxt').textContent = msg; t.style.display = 'block'; }
  }
  document.getElementById('toastOk').addEventListener('click', function(){ document.getElementById('toast').style.display = 'none'; });
  window.addEventListener('hashchange', route);
  route();
})();
</script>
</body>
</html>
