<style>
  :root{ --paper:#EFEAE0; --paper-2:#E6DFCF; --ink:#23262B; --ink-soft:#4A4E55; --indigo:#2D4A6B; --vermilion:#C1442E; --line:rgba(35,38,43,.14); --radius:18px; }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--paper); color:var(--ink); font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; line-height:1.55; -webkit-font-smoothing:antialiased;}
  body::before{content:'';position:fixed;inset:0;background:url(seme.png) no-repeat center 46% / auto min(78vh,640px);opacity:.15;pointer-events:none;z-index:0;}
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:20px 18px 80px;}
  h1{font-size:1.7rem;margin:6px 0 4px;} h2{font-size:1.05rem;margin:22px 0 6px;color:var(--indigo);} h3{margin:12px 0 4px;}
  .eyebrow{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);}
  .sub{color:var(--ink-soft);font-size:.92rem;}
  .notice{border-left:4px solid var(--vermilion);background:#faf5ee;padding:10px 12px;border-radius:8px;margin:12px 0 14px;font-size:14px;}
  a.back, button.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:8px 14px;font:inherit;color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block;}
  button.primary{background:var(--indigo);color:#fff;border:0;border-radius:999px;padding:10px 18px;font:inherit;cursor:pointer;}
  .card{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;margin:8px 0;cursor:pointer;}
  .seal{width:38px;height:38px;border-radius:10px;background:var(--vermilion);color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.2rem;flex:none;}
  .card strong{display:block;} .card span{color:var(--ink-soft);font-size:.88rem;}
  textarea{width:100%;margin-top:4px;padding:8px;border-radius:8px;border:1px solid var(--line);font:inherit;background:#fff;}
  label.q{display:block;margin-top:8px;color:var(--ink-soft);font-size:.92rem;}
  .entry{border:1px solid var(--line);border-radius:10px;padding:10px;margin:8px 0;background:#fff;}

<script>
(function(){
  var ITEMS = [{"titolo": "Tre lune", "origine": "Meditazione cinese del “raccogliere l’essenza della Luna” (J. A. Johnson, Chinese Medical Qigong Therapy, vol. 2, cap. 12), adattata: solo a occhi chiusi, in casa.", "per": "tutti", "durata": "circa 5 minuti", "cosa": ["Siediti o stai in piedi, con il corpo rilassato, e respira piano dal naso.", "A occhi chiusi, immagina davanti a te una Luna grande, di luce argentata.", "Con le mani, come per abbracciarla, immagina di portarla sopra la testa. Tienila lì per qualche respiro.", "Dalla prima Luna ne nasce una seconda: portala davanti al petto, all’altezza del cuore. Tienila per qualche respiro.", "Dalla seconda ne nasce una terza: portala davanti alla pancia, sotto l’ombelico. Tienila per qualche respiro.", "Inspirando, immagina di far entrare la prima Luna nella testa. Espirando, la luce argentata riempie tutta la testa.", "Inspirando, fai entrare la seconda Luna nel petto. Espirando, la luce riempie tutto il petto.", "Inspirando, fai entrare la terza Luna nella pancia. Espirando, la luce riempie tutta la pancia.", "Resta in silenzio qualche respiro, poi apri gli occhi."], "id": "tre-lune"}, {"titolo": "Sole a occhi chiusi", "origine": "Meditazione cinese del “raccogliere l’essenza del Sole” (J. A. Johnson, Chinese Medical Qigong Therapy, vol. 2, cap. 12), adattata: solo immaginata, a occhi chiusi.", "per": "tutti", "durata": "circa 5 minuti", "cosa": ["Stai in piedi o seduto, con il corpo rilassato, e respira piano dal naso.", "Chiudi gli occhi e immagina un Sole dorato, caldo e gentile, davanti a te.", "Inspirando, immagina di ricevere la sua luce dorata. Espirando, lasciala scendere fino alla pancia, sotto l’ombelico.", "Ripeti per qualche minuto: ogni respiro porta nella pancia una goccia di luce dorata.", "Immagina nella pancia una palla di luce dorata. Inspirando brilla di più; espirando i suoi raggi si allargano in tutto il corpo.", "Per finire, immagina la luce che scende dolcemente lungo tutto il corpo, come olio caldo, fino a terra. Resta in silenzio qualche respiro."], "id": "sole-occhi-chiusi"}, {"titolo": "Il cerchio intorno a me", "origine": "Dall’idea di “spazio protetto” nei rituali descritti da I. Fiala (L’arte della magia, lez. IV e XVI), ridotta a una semplice immagine, senza formule né invocazioni.", "per": "adulti", "durata": "circa 5 minuti", "cosa": ["Siediti o stai in piedi in un luogo tranquillo e respira piano.", "Chiudi gli occhi e immagina, a una distanza che senti giusta, un cerchio che ti circonda: può essere di luce, di sabbia, di fili d’erba, come preferisci.", "Guardalo con calma: com’è fatto? Che colore ha? È vicino o più largo?", "Immagina che dentro il cerchio ci sia solo ciò che scegli tu: silenzio, spazio, aria.", "Per qualche respiro resta al centro e senti il corpo. Poi, quando vuoi, immagina il cerchio che si dissolve piano.", "Apri gli occhi e annota che cosa hai notato."], "id": "cerchio-immaginato"}, {"titolo": "Il sorriso che riempie il corpo", "origine": "Pratica del “sorriso interno” riportata in J. Grinberg, L’opera in sintesi (cap. 12, Meditazione e pratiche contemplative).", "per": "tutti", "durata": "circa 5 minuti", "cosa": ["Siediti comodo, con la schiena dritta, e respira piano.", "Fai un piccolo sorriso, anche solo con gli angoli della bocca. Senti come cambia il viso.", "Immagina che l’energia di questo sorriso si diffonda piano in tutto il corpo, come una luce tiepida.", "Falla scendere nel collo, nel petto, nella pancia. Poi, con calma, immagina che raggiunga anche gli organi interni: il cuore, i polmoni, lo stomaco, l’intestino.", "Poi lascia che arrivi alle braccia e alle gambe, fino alle dita.", "Mantieni l’allegria in ogni parte del corpo per alcuni minuti.", "Per finire, lascia andare il sorriso e osserva come ti senti."], "id": "sorriso-interno"}, {"titolo": "Un suono ripetuto", "origine": "Ripetizione di una parola o di un suono (mantra), dal capitolo sul “potere delle parole” (J. A. Johnson, Chinese Medical Qigong Therapy, vol. 3, cap. 26), in forma semplice.", "per": "tutti", "durata": "circa 5 minuti", "cosa": ["Scegli una parola o un suono breve che ti piace e ti fa stare bene: per esempio una vocale lunga, come “aaa”, oppure una parola come “calma”.", "Per un minuto ripetilo a voce normale, piano, ascoltando dove lo senti nel corpo.", "Per un minuto ripetilo a bassa voce, quasi sussurrando.", "Per un minuto ripetilo solo nella mente, senza muovere le labbra.", "Resta un momento in silenzio. Che cosa è rimasto?"], "id": "suono-ripetuto"}, {"titolo": "Luce che si espande e si raccoglie", "origine": "Prima meditazione di “visione interiore” (Nei Guan n. 1) di J. A. Johnson, Chinese Medical Qigong Therapy, vol. 3, cap. 26. Solo la prima delle tre meditazioni.", "per": "adulti", "durata": "circa 8 minuti", "cosa": ["Siediti con la schiena dritta ma rilassata e respira piano. Se vuoi, prima conta da uno a dieci respirando.", "Immagina una luce calda e luminosa nella pancia, sotto l’ombelico.", "Fai salire la luce lungo il centro del corpo, fino al centro della testa.", "Inspirando, immagina che la luce si allarghi verso l’esterno, brillando in tutte le direzioni.", "Espirando, la luce torna al centro della testa e brilla come una brace luminosa.", "Ripeti per qualche minuto.", "Poi lascia scendere la luce lungo il centro del corpo fino alla pancia. Finisci con tre respiri, immaginando una luce che scende lungo il corpo fino a terra."], "id": "nei-guan-1"}, {"titolo": "La luce che gira lungo la colonna", "origine": "Meditazione olmeca descritta in J. Grinberg, L’opera in sintesi (cap. 12, Meditazione e pratiche contemplative).", "per": "adulti", "durata": "circa 10 minuti", "cosa": ["Siediti con la schiena dritta e respira piano.", "Chiudi gli occhi. Immagina una luce alla base della colonna vertebrale.", "Falla ruotare verso sinistra attorno alla colonna, risalendo piano dalla base fino al cranio.", "Ora falla ruotare nello stesso modo dentro la colonna, dalla base fino al cranio.", "Fai lo stesso con il cervello: immagina la luce che gli ruota intorno, verso sinistra.", "Poi con il cuore, i polmoni, lo stomaco, l’intestino.", "Poi con le braccia, le gambe e infine tutto il tronco.", "Resta in silenzio qualche respiro. Poi apri gli occhi."], "id": "luce-olmeca"}, {"titolo": "La fiamma in due tempi", "origine": "Osservazione della fiamma di una candela (I. Fiala, L’arte della magia, lez. V), con lo sguardo fisso senza battere le palpebre, come nella meditazione sulla fiamma; divisa in osservazione e interpretazione.", "per": "adulti", "durata": "circa 10 minuti", "cosa": ["Metti una candela (o una luce a led a forma di fiamma) su un tavolo stabile, a mezzo metro da te, all’altezza degli occhi, in una stanza senza correnti d’aria. Siediti comodo e respira piano.", "Primo tempo, circa 3 minuti: guarda la fiamma con sguardo morbido e fisso, cercando di non battere le palpebre. Se gli occhi si inumidiscono, lascia che succeda. Quando proprio non ne puoi più, chiudi gli occhi.", "A occhi chiusi, guarda l’immagine della fiamma che resta davanti a te. Seguila finché si dissolve. Poi riapri gli occhi e ricomincia, due o tre volte.", "Intanto non cercare significati: descrivi tra te e te ciò che vedi, forma, colore, movimento.", "Secondo tempo, circa 2 minuti: ora, se vuoi, chiediti che cosa ti ha suggerito. Prima pensa alle cause fisiche (aria, cera, stoppino), poi alle tue impressioni.", "Spegni la candela con calma e scrivi nel diario una riga su ciò che hai osservato."], "id": "fiamma-due-tempi"}, {"titolo": "Vedere con le mani", "origine": "Resoconto dell’esperienza di Cuernavaca sulla visione extraoculare (La visión extraocular), adattato: si lavora in coppia, con respirazione dolce.", "per": "tutti", "durata": "circa 20 minuti", "cosa": ["Siete in due: chi pratica e chi accompagna. Sedetevi comodi, uno di fronte all’altro, con la schiena dritta e il corpo rilassato.", "Chi pratica fa un minuto di respiro a narici alternate, a occhi chiusi, piano e senza forzare. Poi per 20 secondi porta l’attenzione allo spazio tra le sopracciglia.", "Sempre a occhi chiusi: lascia fluire i pensieri senza ostacolarli. Poi porta l’attenzione su di te e chiediti: “Chi sono io?”, sentendo la tua presenza. Resta così per qualche minuto.", "Chi accompagna prende le mani di chi pratica tra le sue e immagina una linea di luce bianca, continua e luminosa, che parte dai palmi e arriva al cervello. Resta così finché l’immagine è chiara.", "Se volete, chi accompagna tiene la punta di un cristallo di quarzo vicino al punto tra le sopracciglia, senza premere.", "Chi pratica si mette una benda morbida e completamente opaca sugli occhi. Chi accompagna controlla che non passi luce.", "Chi accompagna appoggia una o due mani di chi pratica su un’immagine a colori: un foglio colorato, una fotografia, un disegno, una targhetta con una figura o un segno semplice. Può anche fargli toccare frutta o piccoli oggetti.", "Chi pratica esplora con le mani come sente e descrive ad alta voce tutto ciò che gli viene: colori, forme, sensazioni, immagini che nascono.", "Chi accompagna mostra com’era davvero l’immagine, si stupisce e si rallegra con naturalezza per ciò che coincide e corregge con gentilezza il resto. Si continua finché c’è piacere; se arriva stanchezza, ci si ferma e si riprende un’altra volta.", "Quando la descrizione va bene, chi pratica allontana le mani dall’immagine e prova a vederla senza toccarla.", "Poi muove le mani nello spazio tra sé e l’immagine, con piccole contrazioni rapide delle dita, come per “scandagliare”. Poi prova a smettere i movimenti e a vedere direttamente.", "Si può variare con altri materiali: fogli di colori diversi, forme, lettere grandi, immagini su targhette, e infine un piccolo percorso nella stanza o in giardino descrivendo ciò che si percepisce.", "Alla fine toglie la benda, ringrazia, e scrivete insieme nel diario che cosa è successo."], "id": "visione-extraoculare"}, {"titolo": "Massaggio dei piedi prima di dormire", "origine": "Auto-massaggio tradizionale cinese del punto Yongquan (Rene 1), al centro della pianta del piede (J. A. Johnson, Chinese Medical Qigong Therapy, vol. 2, cap. 16 e vol. 4, cap. 41).", "per": "adulti", "durata": "circa 5 minuti", "cosa": ["Siediti sul letto e strofina le mani per scaldarle.", "Prendi il piede sinistro con la mano destra. Il punto è al centro della pianta, nell’incavo nel terzo anteriore. L’altra mano resta appoggiata sulla pancia.", "Con il pollice massaggia con delicatezza in cerchio, in senso orario, contando fino a 100 (o meno, come preferisci).", "Poi lo stesso in senso antiorario.", "Ripeti con il piede destro e la mano sinistra.", "Respira piano, poi sdraiati."], "id": "massaggio-piedi"}, {"titolo": "La palla tra le mani", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Esercizio di base: sentire il campo tra i palmi.", "per": "adulti", "durata": "5 minuti", "cosa": ["Stai in piedi o seduto, con la schiena comoda. Strofina i palmi uno contro l’altro finché senti un po’ di calore.", "Allontana le mani molto piano, fino a circa 15-20 cm, poi riavvicinale. Non cercare niente: osserva solo. Che cosa senti tra i palmi? Formicolio, calore, freddo, una leggera pressione?", "Palla. Tieni le mani come attorno a una palla e dai a te stesso il comando: “sento la palla”. Sentine l’elasticità. Falla rotolare spostando le mani.", "Armonica. Avvicina e allontana i palmi: senti la sensazione di una molla, come una fisarmonica che si comprime e si distende.", "Raggio. Con i palmi a 15-20 cm uno dall’altro, manda la sensazione da una mano all’altra e falla tornare indietro. Poi con l’indice di una mano disegna davanti al palmo dell’altra un cerchio, un quadrato, un triangolo: senti il disegno sulla pelle.", "Ripeti a distanze diverse e confronta: quando la sensazione è più forte? Fai un respiro tranquillo e abbassa le mani."], "id": "bronnikov-palla"}, {"titolo": "Pesantezza e leggerezza", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Due sensazioni da evocare e osservare, da soli o su comando di un compagno.", "per": "adulti", "durata": "5-10 minuti", "cosa": ["Siediti con la schiena dritta, le mani sulle ginocchia con i palmi verso l’alto, le ginocchia a 10-15 cm una dall’altra.", "Pesantezza. Dai a te stesso il comando: “corpo pesante”. Sentiti come un contenitore vuoto che si riempie, piano, dall’alto. Osserva calore, pulsazione, la sensazione di riempirsi. Espirare aiuta. Quando la sensazione arriva dì “sì” e torna neutro.", "Leggerezza. Dai il comando: “corpo leggero”. Senti il corpo che si solleva, come se perdesse peso, come se non sentissi gli organi. Inspirare aiuta. Quando arriva dì “sì” e torna neutro.", "Alterna le due sensazioni qualche volta, con calma.", "Poi prova a combinarle: la parte alta pesante e la parte bassa leggera, e al contrario; il lato sinistro pesante e il destro leggero; una gamba pesante e l’altra leggera; una mano pesante e l’altra leggera.", "Nota dove la sensazione non arriva o arriva poco: è solo un’osservazione, non un giudizio. Aumenta il tempo poco alla volta."], "id": "bronnikov-pesantezza"}, {"titolo": "La sfera che si muove", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Spostare una sensazione lungo il corpo; nell’originale lo guida un compagno, qui da soli.", "per": "adulti", "durata": "5-8 minuti", "cosa": ["Siediti con la schiena dritta, le mani sulle ginocchia con i palmi verso l’alto. Strofina i palmi e fai nascere una sensazione sul palmo destro: calore, formicolio, un piccolo peso.", "Immagina di non vedere nulla: senti soltanto. Con il comando “la sfera si sposta”, falla salire lungo il braccio destro fino alla spalla.", "Falla passare dal collo alla spalla sinistra, poi giù per il braccio sinistro fino al palmo sinistro. Poi torna al palmo destro e chiudi il cerchio: mano, braccio, spalla, collo, spalla, braccio, mano.", "Il giro va sempre in senso orario. Ripetilo due o tre volte.", "Prova a rallentare il movimento, ad accelerarlo, a fermarlo in un punto.", "Quando ti viene facile, prova con altri percorsi: piedi, schiena, pancia, petto, testa."], "id": "bronnikov-sfera"}, {"titolo": "Lo spruzzo dagli occhi", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Esercizio chiamato “Splash” nel metodo, preparazione al Livello 2.", "per": "adulti", "durata": "5 minuti", "cosa": ["Siediti con la schiena dritta, le mani sulle ginocchia, i palmi verso l’alto.", "Porta l’attenzione al coccige, alla base della schiena. Strofina i palmi e, con un piccolo movimento circolare di una mano, fai nascere lì una sensazione: ronzio, calore, formicolio.", "Falla salire lentamente lungo la colonna vertebrale fino alla testa. Quando arriva, apri gli occhi di colpo e lascia uscire la sensazione dagli occhi, come uno spruzzo, guardando lontano per 30-60 secondi.", "Poi chiudi gli occhi, riporta la sensazione al coccige e ripeti. Alla seconda volta, quando arriva alla testa apri gli occhi in fretta.", "Con la pratica prova a farlo da solo, senza movimento delle mani, in 2-3 secondi. Per controllare, avvicina una mano agli occhi: si sente una leggera pressione sul palmo."], "id": "bronnikov-spruzzo"}, {"titolo": "Il massaggio tibetano secco", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Sequenza di massaggio e respiro, in piedi.", "per": "adulti", "durata": "5-10 minuti", "cosa": ["Stai in piedi con i piedi alla larghezza delle spalle. Respira dalla bocca, senza sforzo; inspirando, appoggia la punta della lingua al palato.", "Massaggia con il palmo la parte esterna del braccio dalla spalla alle dita, poi la parte interna dalle dita verso l’alto. Cambia braccio.", "Poi la parte interna ed esterna delle gambe, la zona del coccige, la pancia e infine la testa, dalla nuca verso il viso.", "Poi senti il movimento. Inspirando, fai “uscire” la sensazione dalla settima vertebra cervicale e falla scendere lungo il braccio fino alle dita; espirando, rimettila dentro lungo la parte interna del braccio. Ripeti sull’altro braccio.", "Inspirando, prendi la sensazione dal coccige e falla scendere lungo una gamba verso il piede; espirando, risali dentro la gamba. Ripeti 5-10 volte per gamba.", "Inspirando, porta la sensazione dalla settima vertebra sopra la testa e giù fino al viso e alla gola. Ripeti 5-10 volte.", "Per finire, raccogli la sensazione dal coccige come in due tazze, portala davanti a te e, espirando, riportala verso il basso della pancia contraendo i glutei. Ripeti 5-10 volte. Fai tutto lentamente."], "id": "bronnikov-massaggio"}, {"titolo": "Il Drago", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Respiro in piedi che fa “passare” una sensazione dall’alto al basso e viceversa.", "per": "adulti", "durata": "3-5 minuti", "cosa": ["Stai in piedi con i piedi alla larghezza delle spalle e le ginocchia un po’ piegate. Porta le mani all’altezza delle spalle con i palmi verso l’alto.", "Respira dalla bocca, con la lingua appoggiata dolcemente al palato e le labbra quasi chiuse.", "Inspirando, immagina di accogliere la sensazione dall’alto, attraverso i palmi e il viso, e di portarla fino allo stomaco. Trattieni per un attimo.", "Espirando, falla scendere attraverso il perineo e i piedi.", "Ora invertisci: inspirando, accogli dal basso (perineo e piedi); espirando, falla salire e uscire da testa e palmi.", "Cambia il ritmo del respiro e la velocità del flusso. Fai 3-5 minuti e aumenta solo se ti senti bene."], "id": "bronnikov-drago"}, {"titolo": "La Campana", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Due sensazioni da tenere: quella alta nella testa e quella bassa nel perineo.", "per": "adulti", "durata": "2-3 minuti, poi fino a 8-10", "cosa": ["Campana in basso. Stai in piedi con i piedi alla larghezza delle spalle e le ginocchia un po’ piegate, i palmi verso il corpo. La cima della campana sta al centro della testa, il bordo all’altezza delle punte delle dita.", "Senti la sua densità e tienila con le mani. Muovila lentamente avanti, indietro, a sinistra, a destra, in cerchio. Nella testa potresti sentire compressione, e in basso apertura: tra i due centri come un elastico teso.", "Poi ferma le mani e prova a sentire che altre mani, immaginarie, la muovono nello stesso modo.", "Campana in alto. Rovescia l’immagine: la cima della campana sta al centro del perineo, e la campana arriva fin sopra la testa. Ripeti gli stessi movimenti, con le mani e poi senza.", "Comincia con 2-3 minuti e allunga poco alla volta, secondo come ti senti."], "id": "bronnikov-campana"}, {"titolo": "Il bozzolo e il contatto con gli oggetti", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Sentire un campo attorno a sé e tra la mano e le cose.", "per": "adulti", "durata": "5-8 minuti", "cosa": ["Bozzolo. Stai in piedi, le mani all’altezza del petto con i palmi verso di te, a 60-80 cm dal corpo. Dai a te stesso il comando di sentire un bozzolo attorno a te.", "Con carezze e piccoli picchiettii attorno a te cerca la sensazione elastica e densa sotto i palmi. Controlla se è uniforme in tutte le zone, davanti, ai lati, dietro.", "Fai ondeggiare il bozzolo con le mani, poi ferma le mani e senti il bozzolo che continua a muoversi. Prova ad accelerarlo, rallentarlo, ruotarlo.", "Contatto con gli oggetti. Tieni le mani sopra un tavolo o una sedia, a 50-70 cm. Con un palmo senti il campo tra la mano e l’oggetto: dove comincia, quando senti resistenza se allontani la mano.", "Poi spostati a 2-3 metri e prova a mandare la sensazione dal palmo all’oggetto e a sentire ciò che torna. Quando hai finito, distogli l’attenzione e senti la sensazione svanire."], "id": "bronnikov-bozzolo"}, {"titolo": "In due: la prokachka verticale", "origine": "Dal Livello 1 del metodo di V. M. Bronnikov (“Ecologia dello Spirito”), riscritto con parole nostre. Esercizio in coppia del metodo: uno “espira” energia e l’altro “inspira”; poi ci si scambia.", "per": "adulti", "durata": "10-15 minuti", "cosa": ["Siete in due, in piedi, uno di fronte all’altro. Chi riceve resta fermo e porta l’attenzione alle sue sensazioni. Chi guida lavora solo con la sensazione, senza pensare a problemi della persona.", "Strofinate i palmi. Mettete le mani davanti al petto, piegate ai gomiti, e stabilite il contatto tra i palmi. Chi guida fa piccoli movimenti circolari, in senso orario. Chi riceve nota che cosa compare nelle mani: formicolio, calore, freddo, pressione, onde.", "Quando il contatto è stabile, chi riceve dice “sì” e si allontana lentamente indietro, mantenendo il contatto tra i palmi, fino a circa 7 metri.", "Chi guida solleva la sensazione dal basso verso l’alto con movimenti ondulati dei palmi, come per gonfiare un letto di piume. Arrivato all’altezza della testa sposta le mani ai lati e le abbassa con i palmi verso il basso. Ripete 10-12 volte.", "Chi riceve si gira di 180° in senso orario e abbassa le mani; chi guida ripete i movimenti 10-12 volte. Poi chi riceve si rigira in senso orario e si ripete altre 2-3 volte.", "Chi riceve dice sempre come sta. Se ha mal di testa o fastidio, ci si ferma. Poi ci si scambia i ruoli."], "id": "bronnikov-coppia"}, {"titolo": "Foto Splash: colori, figure, numeri", "origine": "Dal Livello 2 del metodo di V. M. Bronnikov (“La visione interna”), riscritto con parole nostre. Esercizio con carte da guardare per un istante e richiamare a occhi chiusi. Va fatto in due.", "per": "adulti", "durata": "10 minuti", "cosa": ["Lavorate in due, uno accanto all’altro. Chi si esercita è seduto bene, con la schiena dritta, e ha gli occhi chiusi o bendati; il compagno tiene le carte e dà i comandi. Prima, qualche minuto di esercizi del Livello 1: Prokachka verticale e spruzzo dagli occhi, 3 volte dalla testa e 3 dagli occhi.", "Chi si esercita ripete mentalmente ogni comando. Quando il risultato è chiaro, dice “sì” forte.", "Colori. Il compagno mostra una carta di un solo colore (blu, rosso, verde, giallo). Chi si esercita guarda per un attimo, fa lo spruzzo dagli occhi, chiude gli occhi e richiama il colore sullo schermo interno. Poi si passa a 2, 3 e 4 colori per volta.", "Figure. Stesso modo, con 1, 2, 3 e 4 figure. Poi numeri: da una cifra fino a cinque cifre.", "Se sullo schermo compaiono punti, strisce o immagini che non hai chiesto, dì con fermezza: “Grazie, ma ora non ne ho bisogno”, e ripeti il comando. Se l’immagine resta vaga, fai un altro spruzzo.", "Per chiudere, porta lo schermo a bianco, poi a una linea, poi a un punto che sparisce, poi a spazio nero. Solo dopo apri gli occhi e fai qualche respiro. Non farlo nell’ora prima di dormire. Con i bambini, un adulto è sempre presente."], "id": "bronnikov-foto-splash"}, {"titolo": "La matrice: righe e colonne", "origine": "Dal Livello 2 del metodo di V. M. Bronnikov (“La visione interna”), riscritto con parole nostre. Esercizio in due che allena la memoria con una griglia mentale.", "per": "adulti", "durata": "10-15 minuti", "cosa": ["Lavorate in due. Chi si esercita ha gli occhi chiusi o bendati e ripete mentalmente ogni comando; il compagno detta.", "Costruite una griglia mentale, per cominciare di 3 righe per 3 colonne. Si riempie da sinistra a destra: la prima cella è prima riga, prima colonna; finita la prima riga si passa alla seconda, sempre da sinistra a destra.", "Il compagno dà, una dopo l’altra, le cose da mettere nelle celle: all’inizio colori, poi forme, poi numeri (per esempio 7, 21, 4 / 19, 5, 11 / 8, 2, 36).", "Per richiamare, il compagno dice per esempio: “Mostrami che cosa c’è nella terza riga, seconda colonna.” Chi si esercita risponde guardando sullo schermo interno.", "Poi ingrandite la griglia: 4×4, 5×5, 6×6. Solo se la precedente è chiara.", "Se compaiono disturbi, si risponde come nella scheda Foto Splash. Alla fine si riporta lo schermo a bianco, linea, punto, spazio nero, prima di aprire gli occhi."], "id": "bronnikov-matrice"}, {"titolo": "Il sentimento prima di dormire", "origine": "Dalla pratica descritta da Neville Goddard in “Sentire è il segreto” (1944), capitolo sul sonno, riscritta con parole nostre.", "per": "adulti", "durata": "5-10 minuti, a letto", "cosa": ["Scegli un desiderio semplice e che non danneggia nessuno. Non pensare a come potrebbe avverarsi, né alle difficoltà: pensa solo al risultato.", "Sdraiati sulla schiena, con la testa allineata al corpo, e rilassati. Lascia andare le tensioni della giornata.", "Chiediti: “Come mi sentirei se fosse già così?”. Cerca il sentimento di chi ha già ciò che desidera: sollievo, gratitudine, calma.", "Resta in quel sentimento, senza forzare, mentre ti lasci scivolare nel sonno. Se arrivano pensieri di dubbio o di mancanza, lasciali passare e torna al sentimento.", "Ripeti la sera dopo, per qualche sera. Al mattino non cercare conferme: osserva solo come stai."], "id": "neville-prima-di-dormire"}, {"titolo": "Rivivere la giornata", "origine": "Dalla pratica della “revisione” descritta da Neville Goddard in “Un’immaginazione risvegliata” (cap. 4), riscritta con parole nostre.", "per": "adulti", "durata": "5-10 minuti, la sera", "cosa": ["La sera, seduto o sdraiato, ripensa a una scena della giornata che ti ha lasciato un senso di peso: una parola, un messaggio, una discussione.", "Rivivila come avresti voluto che fosse. Per esempio, se hai ricevuto un messaggio spiacevole, riscrivilo mentalmente con la notizia che avresti desiderato.", "Ora immagina la nuova scena come se accadesse adesso: leggi il messaggio rivisto, sentine le parole, il tono, la tua reazione.", "Ripetila più volte finché senti che la scena nuova ti sembra naturale e il peso si è alleggerito.", "Finisci con tre respiri lenti. Non serve “credere” a nulla: è un esercizio di attenzione e di immaginazione."], "id": "neville-revisione"}, {"titolo": "Una breve scena al dormiveglia", "origine": "Dalla tecnica descritta da Neville Goddard in “Un’immaginazione risvegliata” (cap. 3), riscritta con parole nostre.", "per": "adulti", "durata": "5 minuti", "cosa": ["Pensa a una piccola scena che implica che il tuo desiderio sia realizzato: non il desiderio in sé, ma un gesto che faresti se fosse già vero, per esempio stringere la mano a qualcuno, aprire una porta, leggere una lettera.", "Sdraiati come per un pisolino e resta fermo. Comincia a rappresentare quella scena nella mente, in modo vivido, con i dettagli e le sensazioni.", "Mentre ti assopisci, immaginati dentro la scena. Il tempo non importa: anche un breve sonnellino basta.", "Se l’attenzione se ne va, riportala con calma alla scena, tutte le volte che serve.", "Alla fine, al risveglio, ripensa un momento alla scena e poi alzati."], "id": "neville-scena-breve"}, {"titolo": "Una frase al presente", "origine": "Dall’idea di formulare il sentimento al presente, in “Sentire è il segreto” di Neville Goddard, riscritta con parole nostre.", "per": "adulti", "durata": "3-5 minuti", "cosa": ["Scegli una frase breve che descrive come vuoi sentirti, detta al presente: “sono sereno”, “sono capace di fermarmi”, “sono in pace”. Evita “sarò” e “diventerò”: contengono già l’idea di una mancanza.", "Siediti o sdraiati. Fai tre respiri lenti.", "Ripeti la frase piano, nella mente, e osserva dove la senti nel corpo. Non devi crederci: basta ascoltare che effetto fa.", "Dopo qualche minuto lascia andare la frase e resta in silenzio per un respiro.", "Per la sera, puoi usarla come ultimo pensiero prima di dormire."], "id": "neville-io-sono"}, {"titolo": "La giornata al contrario", "origine": "Dalle opere di Neville Goddard (raccolta in italiano “La coscienza è l’unica realtà”), riscritto con parole nostre. Esercizio di attenzione, dal capitolo “Attenzione”.", "per": "adulti", "durata": "5-10 minuti, la sera", "cosa": ["A letto, appena prima di dormire, porta l’attenzione all’ultima cosa che hai fatto: metterti a letto.", "Poi torna indietro, un’azione per volta, in ordine inverso: la cena, il pomeriggio, il pranzo, la mattina, fino al primo momento della giornata, quando ti sei alzato.", "Per ogni momento prova a ricordare un dettaglio: dove eri, che cosa vedevi, che cosa sentivi. Non giudicare.", "Se la mente se ne va, riportala con gentilezza al punto in cui eri rimasto. Non è facile, ed è proprio questo l’allenamento.", "Se ti addormenti a metà, va bene. Con la pratica regolare l’attenzione si fa più ferma."], "id": "neville-giornata-al-contrario"}, {"titolo": "La passeggiata immaginaria", "origine": "Dalle opere di Neville Goddard (raccolta in italiano “La coscienza è l’unica realtà”), riscritto con parole nostre. Dai racconti di chi “recita” una piccola azione prima di dormire.", "per": "adulti", "durata": "5 minuti", "cosa": ["Pensa a una piccola azione quotidiana che faresti se il tuo desiderio fosse già realtà: portare a spasso un cane, entrare in casa nuova, camminare in un posto dove vorresti essere.", "Chiudi gli occhi e fallo nell’immaginazione, un passo alla volta, con i sensi: che cosa vedi, che suoni senti, che cosa tocchi, com’è l’aria.", "Resta dentro l’azione come se accadesse adesso, non come un ricordo o un progetto.", "Ripeti la stessa passeggiata per alcune sere, con lo stesso percorso: i dettagli diventeranno più chiari.", "Alla fine fai un respiro lento e riapri gli occhi nella stanza."], "id": "neville-passeggiata"}, {"titolo": "Prima di meditare: nessuno ha colpa", "origine": "Dalle opere di Neville Goddard (raccolta in italiano “La coscienza è l’unica realtà”), riscritto con parole nostre. Un esercizio da fare prima di sedersi in silenzio.", "per": "adulti", "durata": "3-5 minuti", "cosa": ["Siediti e fai tre respiri lenti.", "Pensa a una persona con cui hai avuto un attrito. Per qualche respiro prova a parlare di lei, nella mente, come di una persona senza colpa: senza cercare chi aveva torto.", "Poi pensa a un’altra persona, e a un’altra ancora, anche lontane dalla tua vita. Nella mente, lascia che ognuna sia semplicemente com’è, senza giudizio.", "Poi pensa a te stesso nello stesso modo.", "Resta qualche respiro in silenzio. Poi, se vuoi, passa a una meditazione o a una pratica tranquilla."], "id": "neville-nessuna-colpa"}, {"titolo": "Il sentimento che riempie la mente", "origine": "Dalle opere di Neville Goddard (raccolta in italiano “La coscienza è l’unica realtà”), riscritto con parole nostre. Esercizio di attenzione focalizzata, dal capitolo “Attenzione”.", "per": "adulti", "durata": "5-8 minuti", "cosa": ["Scegli un desiderio chiaro e semplice. Siediti o sdraiati e fai tre respiri lenti.", "Porta l’attenzione al sentimento di averlo già: com’è nel corpo, nel respiro, nel viso.", "Tieni l’attenzione solo lì. Lascia che il sentimento cresca fino a riempire lo spazio della mente, spingendo via gli altri pensieri.", "Quando un pensiero di dubbio o di mancanza arriva, lascialo passare e torna al sentimento. Se ti distrai molte volte, riporta l’attenzione molte volte, con pazienza.", "Finisci con un respiro profondo e annota che cosa hai notato."], "id": "neville-sentimento-pieno"}, {"titolo": "La notizia che vorrei sentire", "origine": "Dalle opere di Neville Goddard (raccolta in italiano “La coscienza è l’unica realtà”), riscritto con parole nostre. Dal capitolo “Buone notizie”: una conversazione immaginata che riguarda solo te.", "per": "adulti", "durata": "5 minuti", "cosa": ["Pensa a una buona notizia che vorresti ricevere, che riguarda solo la tua vita e non danneggia nessuno.", "Chiudi gli occhi e immagina un amico o una persona cara che ti guarda e ti dice quella notizia, con le sue parole e il suo tono di voce.", "Senti la tua reazione: il sorriso, il sollievo, la gioia. Rispondi come risponderesti davvero.", "Rivivi la scena una o due volte, senza forzare, con calma, come se stesse succedendo ora.", "Finisci con un respiro lento e ringrazia, in silenzio."], "id": "neville-buone-notizie"}];
  var GROUPS = [{"t": "Immagine, respiro e luce", "ids": ["tre-lune", "sole-occhi-chiusi", "cerchio-immaginato", "sorriso-interno", "suono-ripetuto", "nei-guan-1", "luce-olmeca", "fiamma-due-tempi", "visione-extraoculare"]}, {"t": "Corpo e movimento", "ids": ["massaggio-piedi"]}, {"t": "Energia e sensazione (Bronnikov, livello 1)", "ids": ["bronnikov-palla", "bronnikov-pesantezza", "bronnikov-sfera", "bronnikov-spruzzo", "bronnikov-massaggio", "bronnikov-drago", "bronnikov-campana", "bronnikov-bozzolo", "bronnikov-coppia"]}, {"t": "Visione interna, in due (Bronnikov, livello 2)", "ids": ["bronnikov-foto-splash", "bronnikov-matrice"]}, {"t": "Immaginazione (Neville Goddard)", "ids": ["neville-prima-di-dormire", "neville-revisione", "neville-scena-breve", "neville-io-sono", "neville-giornata-al-contrario", "neville-passeggiata", "neville-nessuna-colpa", "neville-sentimento-pieno", "neville-buone-notizie"]}];
  var NOTICE = 'Qui sperimentiamo insieme. Per queste pratiche, al momento, non ci sono prove scientifiche e non promettiamo nessun risultato. Pagina pensata per adulti: provale con curiosità, annota che cosa succede e fermati se qualcosa non ti fa stare bene. Non sostituisce cure mediche o psicologiche.';
  var SHORT = 'Sperimentazione: nessuna prova scientifica, nessuna garanzia. Non sostituisce cure mediche o psicologiche.';
  var Q = ['Che cosa ho fatto? (esercizio, quando, da quanto tempo)','Che cosa ho notato nel corpo, nelle emozioni, nei pensieri?','È successo qualcosa di particolare dopo, nelle ore o nei giorni seguenti?','Lo ripeterei? Che cosa cambierei?'];
  var KEY = 'lab_diario', OLD = ['lab_diario_respiro','lab_diario_concentrazione-e-memoria','lab_diario_corpo-e-movimento'];
  function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  try{ localStorage.setItem('pcd_lab','1'); }catch(e){}
  function load(){ try{ return JSON.parse(localStorage.getItem(KEY)||'[]'); }catch(e){ return []; } }
  function save(a){ try{ localStorage.setItem(KEY, JSON.stringify(a)); }catch(e){} }
  (function migrate(){ try{
    var all = load(), n = 0;
    OLD.forEach(function(k){ var v = localStorage.getItem(k); if(!v) return;
      try{ JSON.parse(v).forEach(function(e){ all.push(e); n++; }); }catch(e){}
      localStorage.removeItem(k); });
    if(n){ all.sort(function(a,b){ return (b.data||'') > (a.data||'') ? 1 : -1; }); save(all); }
  }catch(e){} })();
  document.getElementById('notice').textContent = NOTICE;
  var main = document.getElementById('main');
  function byId(id){ for(var i=0;i<ITEMS.length;i++) if(ITEMS[i].id===id) return ITEMS[i]; return null; }
  function list(){
    var h = '';
    GROUPS.forEach(function(g){
      h += '<h2>'+esc(g.t)+'</h2>';
      g.ids.forEach(function(id){ var it = byId(id); if(!it) return;
        h += '<div class="card" data-id="'+esc(id)+'"><div class="seal">試</div><div><strong>'+esc(it.titolo)+'</strong><span>'+esc(it.durata||'')+(it.per==='adulti'?' · solo adulti':'')+'</span></div></div>'; });
    });
    h += '<div style="margin-top:22px;"><button class="ghost" id="dBtn" type="button">Il mio diario di osservazione ('+load().length+')</button></div>';
    main.innerHTML = h;
    Array.prototype.forEach.call(main.querySelectorAll('.card'), function(c){ c.addEventListener('click', function(){ detail(c.getAttribute('data-id')); }); });
    main.querySelector('#dBtn').addEventListener('click', diary);
    window.scrollTo(0,0);
  }
  function detail(id){
    var it = byId(id); if(!it) return list();
    var h = '<button class="ghost" id="bk" type="button">← Laboratorio</button><h3>'+esc(it.titolo)+'</h3>';
    h += '<div class="sub">'+(it.origine?'Da dove viene: '+esc(it.origine)+'<br>':'')+'Per chi: '+(it.per==='adulti'?'solo adulti':'tutti')+(it.durata?' · Durata: '+esc(it.durata):'')+'</div>';
    (it.cosa||[]).forEach(function(p){ h += '<p>'+esc(p)+'</p>'; });
    h += '<p class="sub" style="font-size:12px;">'+esc(SHORT)+'</p><h2>Dopo l’esperimento: il tuo diario</h2>';
    Q.forEach(function(q,i){ h += '<label class="q">'+(i+1)+'. '+esc(q)+'<textarea rows="2" class="lq"></textarea></label>'; });
    h += '<p class="sub" style="font-size:12px;">Nessun risultato è un esito valido.</p><button class="primary" id="sv" type="button">Salva nel diario</button><span id="sd" class="sub" style="margin-left:10px;"></span>';
    main.innerHTML = h; window.scrollTo(0,0);
    main.querySelector('#bk').addEventListener('click', list);
    main.querySelector('#sv').addEventListener('click', function(){
      var r = Array.prototype.map.call(main.querySelectorAll('.lq'), function(t){ return t.value.trim(); });
      var a = load(); a.unshift({id:it.id, titolo:it.titolo, data:new Date().toISOString(), r:r}); save(a);
      Array.prototype.forEach.call(main.querySelectorAll('.lq'), function(t){ t.value=''; }); main.querySelector('#sd').textContent = 'Salvato ✓';
    });
  }
  function diary(){
    var a = load(), h = '<button class="ghost" id="bk" type="button">← Laboratorio</button><h3>Il mio diario di osservazione</h3>';
    if(!a.length) h += '<p class="sub">Ancora nessuna annotazione.</p>';
    a.forEach(function(e,i){
      h += '<div class="entry"><strong>'+esc(e.titolo)+'</strong> <span class="sub">· '+esc(new Date(e.data).toLocaleDateString('it-IT'))+'</span>';
      (e.r||[]).forEach(function(t,k){ if(t) h += '<div class="sub" style="margin-top:6px;"><em>'+esc(Q[k])+'</em><br>'+esc(t)+'</div>'; });
      h += '<div style="margin-top:6px;"><button class="ghost del" data-i="'+i+'" type="button">Elimina</button></div></div>';
    });
    if(a.length) h += '<button class="ghost" id="ex" type="button">Esporta in un file di testo</button>';
    main.innerHTML = h; window.scrollTo(0,0);
    main.querySelector('#bk').addEventListener('click', list);
    Array.prototype.forEach.call(main.querySelectorAll('.del'), function(b){ b.addEventListener('click', function(){ var x = load(); x.splice(parseInt(b.getAttribute('data-i'),10),1); save(x); diary(); }); });
    var ex = main.querySelector('#ex'); if(ex) ex.addEventListener('click', function(){
      var t = 'DIARIO DI OSSERVAZIONE - Laboratorio\n'+SHORT+'\n\n';
      load().forEach(function(e){ t += '== '+e.titolo+' ('+new Date(e.data).toLocaleDateString('it-IT')+')\n'; (e.r||[]).forEach(function(x,k){ t += Q[k]+'\n'+(x||'-')+'\n'; }); t += '\n'; });
